<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <script src="https://unpkg.com/mqtt@5.12.0/dist/mqtt.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:#eef2f6;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    body{display:flex;align-items:flex-start;justify-content:center;padding:18px 10px}
    .app{width:min(430px,100%);background:#fff;border-radius:8px;padding:12px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
    h1{margin:0 0 4px;font-size:22px;line-height:1.15}
    .muted{margin:0 0 14px;color:#64748b;font-size:12px}
    .hidden{display:none!important}
    .load-failed{width:min(360px,100%);text-align:center;background:#fff;color:#172033;border-radius:10px;padding:28px 18px;box-shadow:0 8px 30px rgba(15,23,42,.12)}
    .load-failed h1{font-size:24px;line-height:1.2;margin:0;font-weight:900}
    .load-failed p{margin:12px 0 0;color:#64748b;font-size:14px;line-height:1.5}
    button{height:36px;border:1px solid #2563eb;border-radius:6px;background:#2563eb;color:#fff;font-size:14px;font-weight:800}
    button:disabled{opacity:.55}
    .secondary{background:#fff;color:#2563eb}
    .panel{padding-top:2px}
    .code-table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #dbe3ee;border-radius:7px;overflow:hidden;background:#fff}
    .code-table th,.code-table td{border-top:1px solid #e5edf6;padding:8px 7px;text-align:left;vertical-align:middle}
    .code-table tr:first-child th,.code-table tr:first-child td{border-top:0}
    .code-table th{width:72px;background:#f8fafc;color:#475569;font-size:12px;font-weight:900;white-space:nowrap}
    .value-cell{min-width:0}
    .value-cell strong{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;color:#111827}
    .action-cell{width:94px;padding-left:0}
    .action-cell button{width:100%;height:34px;font-size:13px}
    .code{color:#2563eb;font-size:22px;letter-spacing:0}
    .code.empty{color:#64748b;font-size:14px}
    .usage-badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;margin:0 0 8px;border-radius:999px;background:#0f172a;color:#fff;font-size:14px;font-weight:900}
    .note-box{margin-bottom:9px;border:1px solid #dbe3ee;border-radius:7px;background:#f8fafc;padding:8px 9px;color:#334155;font-size:13px;line-height:1.55}
    .note-title{font-weight:900;color:#111827;margin-bottom:2px}
    .notice{margin-bottom:9px;border:1px solid #bfdbfe;border-radius:7px;background:#eff6ff;color:#1d4ed8;padding:8px 9px;font-size:13px;font-weight:800;line-height:1.35;text-align:center}
    .message{margin-top:9px;min-height:38px;border:1px solid #e5e7eb;border-radius:7px;background:#f8fafc;padding:9px;font-size:13px;line-height:1.4;color:#334155;word-break:break-word}
    .status{display:inline-flex;align-items:center;gap:6px;color:#64748b;font-size:12px;margin-top:10px}
    .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
    .dot.ok{background:#15803d}
    .dot.bad{background:#b91c1c}
  </style>
</head>
<body>
  <main class="app" id="appShell">
    <section id="loadingPanel">
      <p class="muted">加载中</p>
      <div class="message" id="loadingMessage">正在核对链接...</div>
      <div class="status hidden"><i class="dot" id="mqttDot"></i><b id="mqttText">MQTT 连接中</b></div>
    </section>

    <section id="cardPanel" class="hidden">
      <div class="usage-badge hidden" id="usageBadge">-1</div>
      <section class="panel">
        <div class="note-box">
          <div class="note-title">操作说明：</div>
          <div>因号码有时效性。</div>
          <div>请在获取前先打开软件。</div>
          <div>有问题及时联系客服</div>
        </div>
        <div class="notice hidden" id="noticeValue"></div>
        <table class="code-table" aria-label="接码信息">
          <tbody>
            <tr>
              <th>手机号</th>
              <td class="value-cell"><strong id="phoneValue">有时效，打开软件再获取。</strong></td>
              <td class="action-cell"><button id="accountBtn" disabled>获取号码</button></td>
            </tr>
            <tr>
              <th>验证码</th>
              <td class="value-cell" colspan="2"><strong id="codeValue" class="code empty">等待获取。</strong></td>
            </tr>
            <tr>
              <th>倒计时</th>
              <td class="value-cell" colspan="2"><strong id="countdownValue">-</strong></td>
            </tr>
          </tbody>
        </table>
        <button id="codeBtn" class="secondary hidden" disabled>查验证码</button>
        <div class="message hidden" id="messageValue"></div>
        <div class="status hidden"><i class="dot ok"></i><b>链接已核对</b></div>
      </section>
    </section>
  </main>

  <section class="load-failed hidden" id="failedPanel">
    <h1 id="failedTitle">加载失败</h1>
    <p id="failedMessage">请联系客服。</p>
  </section>

  <script>
    const CONFIG = {
      mqttUrl: "wss://e109e31e.ala.cn-hangzhou.emqxsl.cn:8084/mqtt",
      username: "tusi_web_client",
      password: "xg0Cl7HIZlqLq07qD94UzkJZ",
      topicRoot: "pixcheese",
    };

    const clientId = `pix_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    const cardKey = readCardKeyFromUrl();
    const state = {
      mqtt: null,
      token: "",
      phone: "",
      code: "",
      leaseExpiresAt: 0,
      retryAt: 0,
      countdownTimer: null,
      authTimer: null,
      activated: false,
      completed: false,
      awaitingRetry: false,
      useLimit: 1,
      usedCount: 0,
      timeoutCount: 0,
    };

    const $ = id => document.getElementById(id);

    function readCardKeyFromUrl() {
      const params = new URLSearchParams(location.search);
      for (const name of ["cardKey", "key", "pwd", "password", "code"]) {
        const value = cleanCardKey(params.get(name));
        if (value) return value;
      }
      const hashValue = cleanCardKey(location.hash.replace(/^#\/?/, ""));
      if (hashValue) return hashValue;
      const segments = location.pathname.split("/").map(part => {
        try { return decodeURIComponent(part); } catch { return part; }
      }).filter(Boolean);
      const last = cleanCardKey(segments[segments.length - 1] || "");
      const reserved = new Set(["pixcheese", "index.html", "404.html"]);
      if (!last || reserved.has(last.toLowerCase()) || last.includes(".")) return "";
      return last;
    }

    function cleanCardKey(value) {
      return String(value || "").trim().replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 200);
    }

    function showFailed(title = "加载失败", message = "请联系客服。") {
      $("failedTitle").textContent = title;
      $("failedMessage").textContent = message;
      $("appShell").classList.add("hidden");
      $("failedPanel").classList.remove("hidden");
      try { state.mqtt?.end?.(true); } catch {}
    }

    function showCardPanel() {
      $("loadingPanel").classList.add("hidden");
      $("cardPanel").classList.remove("hidden");
    }

    function topic(name) {
      return `${CONFIG.topicRoot}/${name}/${clientId}`;
    }

    function requestTopic(name) {
      return `${CONFIG.topicRoot}/${name}`;
    }

    function requestId(prefix) {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function setLoading(text) {
      $("loadingMessage").textContent = text || "";
    }

    function setMessage(text) {
      $("messageValue").textContent = text || "";
      $("messageValue").classList.toggle("hidden", !text);
    }

    function setNotice(text) {
      $("noticeValue").textContent = text || "";
      $("noticeValue").classList.toggle("hidden", !text);
    }

    function updateUsageBadge() {
      const show = Number(state.useLimit || 1) >= 2 && Number(state.usedCount || 0) === 1 && !state.code;
      $("usageBadge").classList.toggle("hidden", !show);
    }

    function setConnected(ok) {
      $("mqttDot").className = `dot ${ok ? "ok" : "bad"}`;
      $("mqttText").textContent = ok ? "MQTT 已连接" : "MQTT 未连接";
    }

    function publish(name, payload) {
      if (!state.mqtt?.connected) {
        if (state.activated) setMessage("MQTT 未连接，请稍后再试");
        else setLoading("MQTT 未连接，请稍后再试。");
        return false;
      }
      state.mqtt.publish(requestTopic(name), JSON.stringify({ ...payload, clientId }), { qos: 1, retain: false });
      return true;
    }

    function updateButtons(active = Boolean(state.token)) {
      const enabled = Boolean(active && !state.completed);
      $("accountBtn").textContent = state.awaitingRetry ? "重新获取" : "获取号码";
      $("accountBtn").disabled = !enabled;
      $("codeBtn").disabled = true;
    }

    function updateView() {
      $("phoneValue").textContent = state.phone || "有时效，打开软件再获取。";
      $("codeValue").textContent = state.code || "等待获取。";
      $("codeValue").classList.toggle("empty", !state.code);
      updateUsageBadge();
      renderCountdown();
      updateButtons();
    }

    function renderCountdown() {
      const now = Date.now();
      if (state.code) {
        $("countdownValue").textContent = "-";
        return;
      }
      if (state.awaitingRetry) {
        $("countdownValue").textContent = "请重新获取";
        return;
      }
      if (state.retryAt && state.retryAt <= now && !state.completed) {
        $("countdownValue").textContent = "确认中";
        return;
      }
      const countdownTarget = state.retryAt || state.leaseExpiresAt;
      if (!countdownTarget) {
        $("countdownValue").textContent = "-";
        return;
      }
      $("countdownValue").textContent = `${Math.max(0, Math.ceil((countdownTarget - now) / 1000))}s`;
    }

    function copy(text) {
      const value = String(text || "").trim();
      if (value && navigator.clipboard?.writeText) navigator.clipboard.writeText(value).catch(() => {});
    }

    function activateLink() {
      setLoading("正在核对链接...");
      clearTimeout(state.authTimer);
      state.authTimer = setTimeout(() => {
        if (!state.activated) showFailed();
      }, 12000);
      publish("auth/request", { requestId: requestId("auth"), cardKey });
    }

    function handleAuthResult(payload) {
      clearTimeout(state.authTimer);
      if (!payload.ok) {
        state.token = "";
        if (payload.reason === "used") showFailed("已使用", "请联系客服。");
        else showFailed("加载失败", "请联系客服。");
        return;
      }
      state.token = payload.token || "";
      state.activated = true;
      state.completed = false;
      state.awaitingRetry = false;
      state.useLimit = Math.max(1, Number(payload.useLimit || 1));
      state.usedCount = Math.max(0, Number(payload.usedCount || 0));
      state.timeoutCount = Math.max(0, Number(payload.timeoutCount || 0));
      const card = payload.card && typeof payload.card === "object" ? payload.card : {};
      const restoredPhone = card.usedPhone || payload.phone || "";
      const restoredCode = card.verifyCode || payload.code || "";
      state.phone = restoredPhone || "";
      state.code = restoredCode || "";
      state.leaseExpiresAt = Number(card.leaseExpiresAtMs || payload.leaseExpiresAt || payload.leaseExpiresAtMs || 0);
      state.retryAt = Number(payload.retryAt || card.leaseExpiresAtMs || 0);
      state.awaitingRetry = card.retryReady === true;
      state.completed = Boolean(restoredCode);
      setNotice("");
      showCardPanel();
      updateUsageBadge();
      updateButtons(true);
      setMessage("");
      updateView();
      if (restoredPhone && !restoredCode && !state.awaitingRetry) {
        publish("account/request", { requestId: requestId("resume_account"), cardKey, token: state.token });
      }
    }

    function handleAccountResult(payload) {
      if (!payload.ok) {
        state.timeoutCount = Math.max(0, Number(payload.timeoutCount || state.timeoutCount || 0));
        if (payload.reason === "maintenance") {
          state.completed = true;
          setMessage("系统正在维护，请联系客服");
          updateView();
          return;
        }
        setMessage(payload.message || "获取号码失败");
        return;
      }
      state.phone = payload.phone || "";
      state.code = "";
      state.completed = false;
      state.awaitingRetry = false;
      state.leaseExpiresAt = Number(payload.leaseExpiresAt || payload.leaseExpiresAtMs || 0);
      state.retryAt = Number(payload.retryAt || 0);
      state.timeoutCount = Math.max(0, Number(payload.timeoutCount || 0));
      setNotice("");
      setMessage("");
      updateView();
      copy(state.phone);
    }

    function handleCodeResult(payload) {
      if (!payload.ok && payload.reason === "used") {
        showFailed("已使用", "请联系客服。");
        return;
      }
      if (!payload.ok && payload.reason === "maintenance") {
        state.completed = true;
        state.awaitingRetry = false;
        state.timeoutCount = Math.max(0, Number(payload.timeoutCount || state.timeoutCount || 0));
        state.leaseExpiresAt = 0;
        state.retryAt = 0;
        setMessage("系统正在维护，请联系客服");
        updateView();
        return;
      }
      if (!payload.ok && payload.reason === "retry_phone") {
        state.timeoutCount = Math.max(0, Number(payload.timeoutCount || state.timeoutCount || 0));
        state.awaitingRetry = true;
        state.retryAt = Number(payload.retryAt || state.retryAt || 0);
        setNotice("点击重新获取换新号码。");
        setMessage("请重新获取");
        updateView();
        return;
      }
      if (payload.code) {
        state.code = payload.code;
        state.completed = true;
        state.awaitingRetry = false;
        state.useLimit = Math.max(1, Number(payload.useLimit || state.useLimit || 1));
        state.usedCount = Math.max(0, Number(payload.usedCount || state.usedCount || 0));
        state.timeoutCount = Math.max(0, Number(payload.timeoutCount || 0));
        const fallbackRemaining = Math.max(0, state.useLimit - state.usedCount);
        const remainingUses = Number.isFinite(Number(payload.remainingUses)) ? Math.max(0, Number(payload.remainingUses)) : fallbackRemaining;
        setNotice(remainingUses > 0 ? "再次打开或者刷新再次使用。" : "使用结束！欢迎再次光临！");
        setMessage(payload.smsContent || "验证码已收到");
        updateView();
        copy(state.code);
        return;
      }
      state.retryAt = Number(payload.retryAt || state.retryAt || 0);
      state.timeoutCount = Math.max(0, Number(payload.timeoutCount || state.timeoutCount || 0));
      setMessage("");
      updateView();
    }

    function connect() {
      if (!cardKey) {
        showFailed();
        return;
      }
      state.mqtt = mqtt.connect(CONFIG.mqttUrl, {
        username: CONFIG.username,
        password: CONFIG.password,
        clientId,
        clean: true,
        reconnectPeriod: 3000,
      });
      state.mqtt.on("connect", () => {
        setConnected(true);
        [topic("auth/result"), topic("account/result"), topic("code/result")].forEach(name => state.mqtt.subscribe(name, { qos: 1 }));
        activateLink();
      });
      state.mqtt.on("close", () => setConnected(false));
      state.mqtt.on("error", () => setConnected(false));
      state.mqtt.on("message", (name, buffer) => {
        let payload = {};
        try { payload = JSON.parse(buffer.toString()); } catch {}
        if (name === topic("auth/result")) handleAuthResult(payload);
        if (name === topic("account/result")) handleAccountResult(payload);
        if (name === topic("code/result")) handleCodeResult(payload);
      });
    }

    $("accountBtn").addEventListener("click", () => {
      setMessage(state.awaitingRetry ? "正在重新获取号码..." : "正在获取号码...");
      publish("account/request", { requestId: requestId("account"), cardKey, token: state.token });
    });

    $("codeBtn").addEventListener("click", () => {
      setMessage("正在查询验证码...");
      publish("code/request", { requestId: requestId("code"), cardKey, token: state.token });
    });

    $("phoneValue").addEventListener("click", () => copy(state.phone));
    $("codeValue").addEventListener("click", () => copy(state.code));
    state.countdownTimer = setInterval(renderCountdown, 1000);
    connect();
  </script>
</body>
</html>
